baseURL = "https://abhics1002.github.io/abhi-blog/"
languageCode = "en"
defaultContentLanguage = "en"
title = "Abhishek Bharadwaj"
theme = "LoveIt"

[params]
  version = "0.2.X"
  description = "Engineering distributed systems at scale. Practical notes on cloud infrastructure, performance engineering, reliability, and system design."
  keywords = [
    "Abhishek Bharadwaj",
    "distributed systems",
    "cloud infrastructure",
    "Kubernetes",
    "performance engineering",
    "system design",
    "site reliability",
    "scalability"
  ]
  defaultTheme = "auto"
  gitRepo = "https://github.com/abhics1002/abhi-blog"
  fingerprint = ""
  dateFormat = "January 2, 2006"

  [params.header]
    desktopMode = "fixed"
    mobileMode = "auto"
    [params.header.title]
      name = "Abhishek Bharadwaj"
      pre = ""
      post = ""
      typeit = false

  [params.footer]
    enable = true
    copyright = true
    author = true
    since = 2025

  [params.home]
    rss = 10
    [params.home.profile]
      enable = false
    [params.home.posts]
      enable = false

  [params.social]
    GitHub = "abhics1002"
    Linkedin = "abbharadwaj"
    Email = "svits.abhishek@gmail.com"

  [params.page]
    lightgallery = false
    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true
    [params.page.code]
      copy = true
      maxShownLines = 50
    [params.page.math]
      enable = false
    [params.page.share]
      enable = true
      X = true
      Linkedin = true
      HackerNews = true
      Facebook = true
      Threads = false
      Whatsapp = false
      Pinterest = false
      Tumblr = false
      Reddit = false
      VK = false
      Buffer = false
      Xing = false
      Line = false
      Instapaper = false
      Pocket = false
      Flipboard = false
      Weibo = false
      Blogger = false
      Baidu = false
      Odnoklassniki = false
      Evernote = false
      Skype = false
      Trello = false
      Diaspora = false
      Mix = false
      Telegram = false

  [params.search]
    enable = true
    type = "lunr"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
